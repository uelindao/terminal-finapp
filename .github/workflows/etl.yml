name: ETL Financeiro — Sincronizacao de Dados

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 06:00 UTC = 03:00 BRT — fundamentos BR (antes da abertura)
    - cron: '0 6 * * *'
    # 12:00 UTC = 09:00 BRT — precos pos-abertura
    - cron: '0 12 * * *'
    # 00:00 UTC = 21:00 BRT dia anterior — precos fechamento EUA
    - cron: '0 0 * * *'
    # A cada 2h — dados macro (Selic, VIX, cambio)
    - cron: '0 */2 * * *'
    # Domingo 03:00 UTC — historico OHLCV semanal (incremental)
    - cron: '0 3 * * 0'
    # Domingo 05:00 UTC — backtest de divergencias macro x setor (apos o price_history)
    - cron: '0 5 * * 0'
  workflow_dispatch:  # permite execucao manual

concurrency:
  group: etl-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}
  FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
  FMP_API_KEY_2: ${{ secrets.FMP_API_KEY_2 }}
  FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

jobs:
  sync-br:
    name: Sincronizar Ativos Brasil (B3 + FIIs)
    runs-on: ubuntu-latest
    # Cold-start CVM (download de ZIPs DFP+ITR dos últimos 4 anos, ~300MB
    # em memória global do processo) acontece no 1º ticker; depois fica
    # cacheado in-memory para os demais. timeout 60min cobre folga.
    timeout-minutes: 60
    if: github.event.schedule == '0 6 * * *' || github.event.schedule == '0 12 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install requests supabase yfinance pandas numpy python-bcb fredapi beautifulsoup4

      - name: Executar sync_br
        run: python scripts/sync_br.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BRAPI_TOKEN: ${{ secrets.BRAPI_TOKEN }}

  sync-us:
    name: Sincronizar Ativos EUA
    runs-on: ubuntu-latest
    # Roda apenas às 00:00 UTC (após fechamento EUA) — evita estouro de quota FMP
    # 233 tickers × 2 calls = 466 req/run. 2 keys × 250/dia = 500 req/dia → só 1 run/dia
    if: github.event.schedule == '0 0 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install requests supabase yfinance pandas numpy beautifulsoup4

      - name: Executar sync_us
        run: python scripts/sync_us.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FMP_API_KEY_2: ${{ secrets.FMP_API_KEY_2 }}

  sync-price-history:
    name: Sincronizar Historico OHLCV (semanal)
    runs-on: ubuntu-latest
    # Roda domingo 03:00 UTC ou manualmente.
    # Cold-start inicial leva ~20min; runs incrementais ~5min.
    if: github.event.schedule == '0 3 * * 0' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install requests supabase yfinance pandas numpy

      - name: Executar sync_price_history
        run: python scripts/sync_price_history.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  backtest-divergencias:
    name: Backtest de Divergencias Macro x Setor (semanal)
    runs-on: ubuntu-latest
    # Domingo 05:00 UTC (apos o price_history semanal das 03:00) ou manualmente.
    # Recalcula e PERSISTE a estatistica por quadrante (fwd RS/hit/n) que a UI le.
    if: github.event.schedule == '0 5 * * 0' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install supabase yfinance pandas numpy python-bcb

      - name: Executar backtest de divergencias (--save)
        run: python scripts/backtest_divergencias.py --anos 8 --min-persist 2 --save
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  sync-macro:
    name: Sincronizar Dados Macro
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 */2 * * *' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install requests supabase yfinance pandas numpy python-bcb fredapi

      - name: Executar sync_macro
        run: python scripts/sync_macro.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

  test:
    name: Testes Automatizados
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Executar testes
        run: python -m pytest tests/ -v --tb=short
